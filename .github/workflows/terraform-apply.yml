name: Terraform Apply

# Execução apenas manual — sem agendamento automático.
on:
  workflow_dispatch:

# Evita execuções paralelas que corrompem o state.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.8.3"
  KUBECTL_VERSION: "v1.30.9"
  AWS_REGION: "us-east-1"
  CLUSTER_NAME: "vault-eks-lab"
  TF_STATE_KEY: "vault-eks-lab/terraform.tfstate"
  # Bootstrap desabilitado no null_resource — roda como step separado abaixo.
  TF_VAR_vault_bootstrap_enabled: "false"

jobs:
  apply:
    name: Plan & Apply
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. Código ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Ferramentas ────────────────────────────────────────────────────
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests

      # ── 3. Credenciais AWS ────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 4. Terraform Init ─────────────────────────────────────────────────
      - name: Terraform Init
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -upgrade
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      # ── 5. Terraform Plan ─────────────────────────────────────────────────
      - name: Terraform Plan
        run: |
          tofu plan \
            -var-file=terraform.tfvars.ci \
            -out=tfplan \
            2>&1 | tee plan_output.txt
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      - name: Publish plan summary
        run: |
          {
            echo "### Terraform Plan — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            grep -E "(#|Plan:|No changes)" plan_output.txt | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 6. Terraform Apply (sem bootstrap) ────────────────────────────────
      - name: Terraform Apply
        run: tofu apply -auto-approve tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}

      # ── 7. kubeconfig (cluster garantidamente existe após o apply) ─────────
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      # ── 8. Aguarda Vault Ready antes do bootstrap ─────────────────────────
      - name: Wait for Vault pods Ready
        run: |
          echo "Aguardando vault-0 ficar Ready (timeout 10min)..."
          kubectl wait pod/vault-0 \
            --namespace vault \
            --for=condition=Ready \
            --timeout=600s

      # ── 9. Bootstrap do Vault (com retry automático) ──────────────────────
      # vault-init.json é gravado diretamente no S3 via --output-s3-uri.
      # Nenhum arquivo de credenciais é criado no filesystem do runner.
      - name: Vault Bootstrap
        id: bootstrap
        run: |
          CLUSTER_ENDPOINT=$(tofu output -raw eks_cluster_endpoint 2>/dev/null || \
            aws eks describe-cluster --name "${{ env.CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}" \
              --query 'cluster.endpoint' --output text)
          K8S_CA_B64=$(aws eks describe-cluster \
            --name "${{ env.CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}" \
            --query 'cluster.certificateAuthority.data' --output text)
          VAULT_CA_B64=$(kubectl get secret vault-server-tls -n vault \
            -o jsonpath='{.data.ca\.crt}' 2>/dev/null || echo "")

          python3 ./scripts/bootstrap_vault.py \
            --namespace "vault" \
            --service-account "vault" \
            --cluster-name "${{ env.CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --kubernetes-host "${CLUSTER_ENDPOINT}" \
            --kubernetes-ca-b64 "${K8S_CA_B64}" \
            --vault-ca-cert-b64 "${VAULT_CA_B64}" \
            --output-file "/tmp/vault-init.json" \
            --output-s3-uri "s3://${{ secrets.TF_STATE_BUCKET }}/vault-bootstrap/vault-init.json" \
            --postgres-host "postgres-service.postgres.svc.cluster.local" \
            --postgres-port "5432" \
            --postgres-database-name "psdb" \
            --postgres-admin-username "psuser" \
            --postgres-admin-password "${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            --vault-db-connection-name "postgres" \
            --vault-db-role-name "postgres-dynamic" \
            --vault-hostname "vault.lab-internal.com.br" \
            --oidc-discovery-url "https://dev-xshlmenrpahbcg1d.us.auth0.com/" \
            --oidc-client-id "h38ZpE10ODF1fShcYTUZ5M5vyKGrka0U" \
            --oidc-client-secret "${{ secrets.VAULT_OIDC_CLIENT_SECRET }}" \
            --oidc-bound-email "alan.and.costa@gmail.com" \
            --oidc-role-name "auth0-admin"

      # ── 10. Retry do bootstrap se falhou ──────────────────────────────────
      - name: Vault Bootstrap (retry)
        if: failure() && steps.bootstrap.outcome == 'failure'
        run: |
          echo "Primeira tentativa falhou. Aguardando 60s e tentando novamente..."
          sleep 60

          CLUSTER_ENDPOINT=$(aws eks describe-cluster \
            --name "${{ env.CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}" \
            --query 'cluster.endpoint' --output text)
          K8S_CA_B64=$(aws eks describe-cluster \
            --name "${{ env.CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}" \
            --query 'cluster.certificateAuthority.data' --output text)
          VAULT_CA_B64=$(kubectl get secret vault-server-tls -n vault \
            -o jsonpath='{.data.ca\.crt}' 2>/dev/null || echo "")

          python3 ./scripts/bootstrap_vault.py \
            --namespace "vault" \
            --service-account "vault" \
            --cluster-name "${{ env.CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --kubernetes-host "${CLUSTER_ENDPOINT}" \
            --kubernetes-ca-b64 "${K8S_CA_B64}" \
            --vault-ca-cert-b64 "${VAULT_CA_B64}" \
            --output-file "/tmp/vault-init.json" \
            --output-s3-uri "s3://${{ secrets.TF_STATE_BUCKET }}/vault-bootstrap/vault-init.json" \
            --postgres-host "postgres-service.postgres.svc.cluster.local" \
            --postgres-port "5432" \
            --postgres-database-name "psdb" \
            --postgres-admin-username "psuser" \
            --postgres-admin-password "${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            --vault-db-connection-name "postgres" \
            --vault-db-role-name "postgres-dynamic" \
            --vault-hostname "vault.lab-internal.com.br" \
            --oidc-discovery-url "https://dev-xshlmenrpahbcg1d.us.auth0.com/" \
            --oidc-client-id "h38ZpE10ODF1fShcYTUZ5M5vyKGrka0U" \
            --oidc-client-secret "${{ secrets.VAULT_OIDC_CLIENT_SECRET }}" \
            --oidc-bound-email "alan.and.costa@gmail.com" \
            --oidc-role-name "auth0-admin"

      # ── 11. Outputs ────────────────────────────────────────────────────────
      - name: Terraform Outputs
        if: always()
        run: |
          {
            echo "### Terraform Outputs"
            echo '```'
            tofu output 2>/dev/null || echo "(outputs indisponíveis)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_vault_oidc_client_secret: ${{ secrets.VAULT_OIDC_CLIENT_SECRET }}
